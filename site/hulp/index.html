<html lang="nl">
  <head>
    <meta charset="utf-8" />

    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" href="../favicon.ico" />
    <style>
      @font-face { font-family: 'Instrument Serif'; font-style: normal; font-display: swap; src: url('fonts/InstrumentSerif_400Regular.ttf'); }
      @font-face { font-family: 'Instrument Serif'; font-style: italic; font-display: swap; src: url('fonts/InstrumentSerif_400Regular_Italic.ttf'); }
      @font-face { font-family: 'Pinyon Script'; font-display: swap; src: url('fonts/PinyonScript_400Regular.ttf'); }
      @font-face { font-family: 'Bricolage'; font-weight: 400; font-display: swap; src: url('fonts/BricolageGrotesque_400Regular.ttf'); }
      @font-face { font-family: 'Bricolage'; font-weight: 600; font-display: swap; src: url('fonts/BricolageGrotesque_600SemiBold.ttf'); }

      :root {
        --ink: #141114;
        --ink-soft: #3a333e;
        --muted: #776f7e;
        --line: #eeeaf2;
        --line-strong: #dcd5e3;
        --chalk: #f6f4f8;
        --cherry: #d81e47;
        --cherry-soft: #ffe3ea;
        --lilac: #6f4fe8;
        --honey: #b86e0f;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; background: #ffffff; color: var(--ink); font: 400 17px/1.55 'Bricolage', system-ui, sans-serif; }
      a { color: inherit; }
      em { font-style: italic; color: var(--cherry); }
      .wrap { max-width: 1180px; margin: 0 auto; padding: 22px 24px 64px; }

      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
      .wordmark { display: inline-flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--ink); direction: ltr; }
      .wordmark .script { font: 400 46px/1 'Pinyon Script', cursive; white-space: nowrap; }
      .wordmark .beauty { font: 400 11px/1 'Instrument Serif', serif; letter-spacing: 0.42em; margin-right: -0.42em; margin-top: -2px; }
      .head-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
      .back { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-strong);
        text-decoration: none; font-weight: 600; font-size: 15px; }
      .back:hover { background: var(--chalk); }
      .lang { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 6px 0 14px; border-radius: 999px; background: var(--chalk); font-size: 14px; color: var(--muted); }
      .lang select { border: 0; background: transparent; font: 600 15px 'Bricolage', sans-serif; color: var(--ink); padding: 8px 6px; cursor: pointer; }

      .intro { padding: 48px 0 30px; }
      .sticker { display: inline-block; padding: 9px 16px 8px; border-radius: 999px; background: var(--cherry); color: #fff; font: 600 14px/1 'Bricolage', sans-serif;
        letter-spacing: 0.14em; text-transform: uppercase; transform: rotate(-3deg); box-shadow: 0 10px 22px -12px rgba(20, 17, 20, 0.5); }
      h1 { margin: 22px 0 14px; font: 400 clamp(52px, 8vw, 96px)/0.98 'Instrument Serif', serif; letter-spacing: -0.012em; }
      .lead { margin: 0; max-width: 680px; font-size: 19px; color: var(--ink-soft); }

      .player { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 26px; align-items: start; }
      .video { border-radius: 26px; overflow: hidden; background: var(--chalk); box-shadow: 0 40px 80px -46px rgba(20, 17, 20, 0.55), 0 0 0 1px var(--line); }
      .video video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #fff; }
      .chapters { border: 1px solid var(--line); border-radius: 22px; padding: 20px 14px 16px; }
      .chapters h2 { margin: 0 8px 10px; font: 400 32px/1.1 'Instrument Serif', serif; }
      .chapters ol { list-style: none; margin: 0; padding: 0; }
      .chapters button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 8px; border: 0; border-radius: 14px; background: transparent;
        font: 400 16px/1.3 'Bricolage', sans-serif; color: var(--ink); text-align: start; cursor: pointer; }
      .chapters button:hover { background: var(--chalk); }
      .chapters button[aria-current='true'] { background: var(--cherry-soft); }
      .chapters time { flex: none; min-width: 48px; padding: 5px 0; border-radius: 999px; background: var(--chalk); font: 600 13px/1 'Bricolage', sans-serif;
        text-align: center; font-variant-numeric: tabular-nums; direction: ltr; }
      .chapters button[aria-current='true'] time { background: var(--cherry); color: #fff; }
      .note { margin: 12px 8px 0; font-size: 14px; color: var(--muted); }

      .faq { padding-top: 56px; }
      .faq h2 { margin: 0 0 18px; font: 400 clamp(38px, 5vw, 54px)/1 'Instrument Serif', serif; }
      .faq-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      details { border: 1px solid var(--line); border-radius: 20px; background: #fff; }
      details[open] { border-color: var(--line-strong); background: var(--chalk); }
      summary { list-style: none; cursor: pointer; padding: 18px 22px; font-weight: 600; display: flex; justify-content: space-between; gap: 14px; }
      summary::-webkit-details-marker { display: none; }
      summary::after { content: '+'; flex: none; color: var(--cherry); font-weight: 600; }
      details[open] summary::after { content: '–'; }
      details p { margin: 0; padding: 0 22px 20px; color: var(--ink-soft); }

      .cta { display: flex; gap: 12px; flex-wrap: wrap; padding-top: 44px; }
      .button { display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 999px; background: var(--cherry); color: #fff;
        text-decoration: none; font-weight: 600; box-shadow: 0 14px 30px -16px rgba(216, 30, 71, 0.75); }
      .button.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line-strong); box-shadow: none; }
      footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }

      @media (max-width: 900px) {
        .player { grid-template-columns: 1fr; }
        .faq-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 560px) {
        .wrap { padding: 16px 16px 48px; }
        .wordmark .script { font-size: 38px; }
        .back { display: none; }
        .intro { padding: 32px 0 22px; }
        .lead { font-size: 17px; }
        .video { border-radius: 18px; }
      }
    </style>

            <track kind="subtitles" srclang="nl" label="Nederlands" src="blanche-uitleg.nl.vtt" />

        <aside class="chapters">
          <h2 data-t="chaptersTitle"></h2>
          <ol id="chapters"></ol>
          <p class="note" data-t="videoNote"></p>
        </aside>
      </section>

      <section class="faq">
        <h2 data-t="faqTitle"></h2>

      </div>
      <footer data-t="footer"></footer>

      const select = document.getElementById('lang');
      const video = document.getElementById('video');
      let chapters = [];
      let lang = 'nl';

      function stored() {
        try {
          return localStorage.getItem('blanche-help-lang');
        } catch {
          return null;
        }
      }

      const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

      /** Dutch viewers get Dutch subtitles; everyone else the English ones. */
      function subtitles() {
        const want = lang === 'nl' ? 'nl' : 'en';
        for (const track of video.textTracks) track.mode = track.language === want ? 'showing' : 'hidden';
      }

      function renderChapters() {
        const t = TEXT[lang];
        const list = document.getElementById('chapters');
        list.innerHTML = '';
        for (const chapter of chapters) {
          const li = document.createElement('li');
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.start = chapter.start;
          button.innerHTML = `<time>${clock(chapter.start)}</time><span></span>`;
          button.querySelector('span').textContent = t.chapters[chapter.id];
          button.addEventListener('click', () => {
            video.currentTime = chapter.start + 0.05;
            video.play();
          });
          li.appendChild(button);
          list.appendChild(li);
        }
        markChapter();
      }

      function markChapter() {
        const buttons = [...document.querySelectorAll('#chapters button')];
        const now = video.currentTime;
        let current = 0;
        buttons.forEach((b, i) => {
          if (Number(b.dataset.start) <= now + 0.1) current = i;
        });
        buttons.forEach((b, i) => b.setAttribute('aria-current', String(i === current && now > 0)));
      }

      function renderFaq() {
        const box = document.getElementById('faq');
        box.innerHTML = '';
        for (const [q, a] of TEXT[lang].faq) {
          const item = document.createElement('details');
          const summary = document.createElement('summary');
          summary.textContent = q;
          const p = document.createElement('p');
          p.textContent = a;
          item.append(summary, p);
          box.appendChild(item);
        }
      }

      function apply(next) {
        lang = TEXT[next] ? next : 'nl';
        const t = TEXT[lang];
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.title = `Blanche Beauty · ${t.eyebrow}`;
        document.querySelectorAll('[data-t]').forEach((el) => {
          el.innerHTML = t[el.dataset.t];
        });
        select.value = lang;
        select.setAttribute('aria-label', t.lang);
        // Back to the start page, and into the app and the admin panel, in the same language.
        for (const id of ['home', 'back']) document.getElementById(id).href = `../?lang=${lang}`;
        document.getElementById('open').href = `../app/?lang=${lang}`;
        document.getElementById('admin').href = `../admin/?lang=${lang}`;
        renderChapters();
        renderFaq();
        subtitles();
        try {
          localStorage.setItem('blanche-help-lang', lang);
        } catch {
          // Private windows may refuse storage; the page still works.
        }
      }

      video.addEventListener('loadedmetadata', subtitles);
      video.addEventListener('timeupdate', markChapter);
      select.addEventListener('change', () => apply(select.value));
      fetch('chapters.json')
        .then((r) => r.json())
        .then((list) => {
          chapters = list;
          renderChapters();
        })
        .catch(() => {});
      const fromLink = new URLSearchParams(location.search).get('lang');
      apply(TEXT[fromLink] ? fromLink : TEXT[stored()] ? stored() : 'nl');
    </script>
  </body>
